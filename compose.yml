name: cmdry-stack
services:
  cmdry:
    build: .
    container_name: 8087-cmdry
    network_mode: host
    environment:
      CMDRY_ADDR: "192.168.7.233:8087"
      CMDRY_DEMO_MODE: "false"
      CMDRY_PLUGIN_DIR: /opt/cmdry/plugins
      CMDRY_DATA_DIR: /opt/cmdry/data
    volumes:
      - /home/sottey/docker-data/cmdry-data:/opt/cmdry/data
      - /home/sottey/docker-data/cmdry-data/dist/plugins:/opt/cmdry/plugins    
    restart: unless-stopped
    labels:
      - homepage.group=Grump
      - homepage.name=(8087) Cmdry
      - homepage.icon=sh-omnitools.png
      - homepage.href=http://192.168.7.233:8087
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://192.168.7.233:8087"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cmdry-demo:
    build: .
    container_name: 8088-cmdry-demo
    network_mode: host
    environment:
      CMDRY_ADDR: "192.168.7.233:8088"
      CMDRY_DEMO_MODE: "true"
      CMDRY_PLUGIN_DIR: /opt/cmdry/plugins
      CMDRY_DATA_DIR: /opt/cmdry/data
    volumes:
      - /home/sottey/docker-data/cmdry-data/dist/plugins:/opt/cmdry/plugins:ro
    tmpfs:
      - /opt/cmdry/data
    restart: unless-stopped
    labels:
      - homepage.group=Grump
      - homepage.name=(8088) Cmdry Demo (cmdry.cott.us)
      - homepage.icon=sh-omnitools.png
      - homepage.href=https://cmdry.cott.us
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://192.168.7.233:8088/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
